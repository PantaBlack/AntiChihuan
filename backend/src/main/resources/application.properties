spring.application.name=antichihuan-api
server.port=8080

# Configuración híbrida de Base de Datos (H2 persistente en archivo compatible con SQL Server / Cloud)
spring.datasource.url=jdbc:h2:file:./data/antichihuandb;MODE=MSSQLServer;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Para conectar a SQL Server en entorno empresarial, descomentar:
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AntiChihuanDb;encrypt=true;trustServerCertificate=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Seguridad JWT
app.jwt.secret=AntiChihuanSuperSecretKeyForJwtSigning2026UniversidadPrivadaDelNorteUPN!
app.jwt.expiration-ms=604800000

# Integración con Google Gemini AI (Machine Learning / LLM)
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
